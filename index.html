
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>Mini GTA 3D</title>
<style>
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
#hud{position:absolute;top:10px;left:10px;color:white;background:#111c;padding:12px;border-radius:12px;z-index:2}
#controls{position:absolute;bottom:20px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:3}
.pad{display:grid;grid-template-columns:60px 60px 60px;gap:5px}
button{background:#222;color:white;border:2px solid white;border-radius:15px;height:60px;font-size:23px;touch-action:none}
.action{background:#c22;border-radius:50%;width:80px;height:80px;font-size:13px}
</style>
</head>
<body>

<div id="hud">
🏙️ MINI GTA 3D<br>
<span id="status">Loading character...</span><br>
❤️ 100 | 💰 <span id="cash">0</span>
</div>

<div id="controls">
<div class="pad">
<div></div><button data-k="up">⬆️</button><div></div>
<button data-k="left">⬅️</button><button data-k="down">⬇️</button><button data-k="right">➡️</button>
</div>
<div style="display:flex;gap:8px">
<button class="action" id="fire">👊<br>ATTACK</button>
<button class="action" id="car">🚗<br>CAR</button>
</div>
</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,50,250);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(50,100,50);
scene.add(light);

function box(w,h,d,c,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color:c})
);
m.position.set(x,y,z);
m.castShadow=true;
m.receiveShadow=true;
scene.add(m);
return m;
}

// Ground
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
new THREE.MeshStandardMaterial({color:0x478047})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

// Roads
for(let i=-200;i<=200;i+=40){
box(12,.1,400,0x333333,i,.05,0);
box(400,.1,12,0x333333,0,.05,i);
}

// Road lines
for(let i=-200;i<200;i+=20){
box(.15,.12,8,0xffffff,i,.1,0);
box(8,.12,.15,0xffffff,0,.1,i);
}

// Buildings
for(let x=-200;x<200;x+=40){
for(let z=-200;z<200;z+=40){
if(Math.abs(x%40)<12||Math.abs(z%40)<12)continue;
let h=12+Math.random()*22;
box(25,h,25,0x888888,x,h/2,z);
}
}

// Character
let player=new THREE.Group();
scene.add(player);
let mixer=null;
let walkAction=null;
let idleAction=null;
let characterLoaded=false;

const loader=new GLTFLoader();

// Exact uploaded file name
loader.load('The_Miami_Dealer.glb',
gltf=>{
const model=gltf.scene;

model.scale.set(1,1,1);
model.position.set(0,0,0);

model.traverse(obj=>{
if(obj.isMesh){
obj.castShadow=true;
obj.receiveShadow=true;
}
});

player.add(model);

if(gltf.animations.length){
mixer=new THREE.AnimationMixer(model);

gltf.animations.forEach(clip=>{
const action=mixer.clipAction(clip);
const n=clip.name.toLowerCase();

if(n.includes('walk')||n.includes('run')){
walkAction=action;
}
else{
idleAction=action;
}
});

if(idleAction)idleAction.play();
else if(walkAction)walkAction.play();
}

characterLoaded=true;
document.getElementById('status').innerText='Character ready!';
},
undefined,
err=>{
console.error(err);
document.getElementById('status').innerText='Model loading failed!';
}
);

// Simple car
const carGroup=new THREE.Group();
scene.add(carGroup);

box(2,1,4,0xff2222,0,0,0);
const carBody=new THREE.Mesh(
new THREE.BoxGeometry(1.5,.8,2),
new THREE.MeshStandardMaterial({color:0x88ccff})
);
carBody.position.y=1.3;
carGroup.add(carBody);

// Player movement
const keys={};
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
});
document.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

document.querySelectorAll('[data-k]').forEach(b=>{
const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[k]=true;
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{
b.addEventListener(ev,()=>keys[k]=false);
});
});

let yaw=0;
let driving=false;
let money=0;

document.getElementById('car').addEventListener('pointerdown',()=>{
if(player.position.distanceTo(carGroup.position)<5){
driving=!driving;
document.getElementById('status').innerText=driving?'Driving car':'On foot';
}
});

document.getElementById('fire').addEventListener('pointerdown',()=>{
document.getElementById('status').innerText='Attack!';
});

const clock=new THREE.Clock();

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);

if(mixer)mixer.update(dt);

let move=0,turn=0;
if(keys.up||keys.w)move=1;
if(keys.down||keys.s)move=-1;
if(keys.left||keys.a)turn=1;
if(keys.right||keys.d)turn=-1;

let target=player;

if(driving){
target=carGroup;
}
else{
yaw+=turn*dt*2;
player.rotation.y=yaw;
}

target.rotation.y=yaw;

target.position.x+=Math.sin(yaw)*move*dt*(driving?15:6);
target.position.z+=Math.cos(yaw)*move*dt*(driving?15:6);

if(driving)player.position.copy(carGroup.position);

// Animation
if(walkAction&&idleAction){
if(move!==0){
idleAction.stop();
walkAction.play();
}
else{
walkAction.stop();
idleAction.play();
}
}

// Camera behind character
let dist=driving?10:6;
let height=driving?5:3;

let desired=new THREE.Vector3(
target.position.x-Math.sin(yaw)*dist,
target.position.y+height,
target.position.z-Math.cos(yaw)*dist
);

camera.position.lerp(desired,.12);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

document.getElementById('cash').innerText=money;
renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
