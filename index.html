
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini City V3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#101820dd;padding:12px;border-radius:12px;z-index:2}
#controls{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px 55px;gap:4px}
button{color:white;background:#20242a;border:2px solid #ddd;border-radius:12px;font-size:22px;touch-action:none}
.pad button{width:55px;height:55px}
.action{width:75px;height:75px;border-radius:50%;font-size:13px;background:#b71c1c}
</style>
</head>
<body>
<div id="hud">
<b>🏙️ MINI CITY V3</b><br>
<span id="mission">Mission: Collect money</span><br>
❤️ <span id="hp">100</span> | ⭐ <span id="wanted">0</span><br>
💰 <span id="cash">0</span>
</div>
<canvas id="c"></canvas>
<div id="controls">
<div class="pad">
<div></div><button data-k="up">⬆</button><div></div>
<button data-k="left">⬅</button><button data-k="down">⬇</button><button data-k="right">➡</button>
</div>
<div style="display:flex;gap:6px">
<button class="action" id="fire">🔫<br>FIRE</button>
<button class="action" id="enter">🚗<br>ENTER</button>
</div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
resize();addEventListener('resize',resize);

const world=2400,keys={};
let player={x:300,y:300,hp:100};
let car={x:450,y:300,a:0,speed:0};
let police={x:900,y:900,a:0};
let inCar=false,cash=0,wanted=0;
let bullets=[],enemies=[],traffic=[],coins=[];
let cam={x:0,y:0};

function rnd(a,b){return a+Math.random()*(b-a)}

for(let i=0;i<15;i++)
 enemies.push({x:rnd(100,2300),y:rnd(100,2300),hp:3});

for(let i=0;i<16;i++)
 traffic.push({x:rnd(0,2400),y:200+Math.floor(rnd(0,6))*400,
 d:Math.random()<.5?1:-1,s:rnd(1,3),col:['#e33','#29f','#f9b','#eee','#39a'][i%5]});

for(let i=0;i<12;i++)
 coins.push({x:rnd(100,2300),y:rnd(100,2300),got:false});

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')shoot();
 if(e.key.toLowerCase()==='e')enterCar();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll('[data-k]').forEach(b=>{
 let k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});

document.getElementById('enter').addEventListener('pointerdown',e=>{
 e.preventDefault();enterCar();
});
document.getElementById('fire').addEventListener('pointerdown',e=>{
 e.preventDefault();shoot();
});

function enterCar(){
 if(!inCar && Math.hypot(player.x-car.x,player.y-car.y)<100){
 inCar=true;
 document.getElementById('mission').innerText='Drive around the city!';
 }else if(inCar){
 inCar=false;player.x=car.x+40;player.y=car.y;
 }
}

function shoot(){
 let p=inCar?car:player;
 for(let e of enemies){
 if(Math.hypot(e.x-p.x,e.y-p.y)<250){
 e.hp--;
 wanted=Math.min(5,wanted+1);
 if(e.hp<=0){
 enemies.splice(enemies.indexOf(e),1);
 cash+=20;
 enemies.push({x:rnd(100,2300),y:rnd(100,2300),hp:3});
 }
 return;
 }
 }
}

function movement(){
 if(inCar){
 if(keys.up||keys.w)car.speed=Math.min(6,car.speed+.12);
 else if(keys.down||keys.s)car.speed=Math.max(-3,car.speed-.12);
 else car.speed*=.97;

 if(keys.left||keys.a)car.a-=.04;
 if(keys.right||keys.d)car.a+=.04;

 car.x+=Math.sin(car.a)*car.speed;
 car.y-=Math.cos(car.a)*car.speed;
 player.x=car.x;player.y=car.y;
 }else{
 if(keys.up||keys.w)player.y-=2.7;
 if(keys.down||keys.s)player.y+=2.7;
 if(keys.left||keys.a)player.x-=2.7;
 if(keys.right||keys.d)player.x+=2.7;
 }
 let p=inCar?car:player;
 p.x=Math.max(20,Math.min(world-20,p.x));
 p.y=Math.max(20,Math.min(world-20,p.y));
}

function drawCity(){
 ctx.fillStyle='#49794a';ctx.fillRect(0,0,world,world);

 // roads
 ctx.fillStyle='#303338';
 for(let i=200;i<world;i+=400){
 ctx.fillRect(i-65,0,130,world);
 ctx.fillRect(0,i-65,world,130);
 }
 // markings
 ctx.strokeStyle='#ddd';ctx.lineWidth=4;ctx.setLineDash([30,30]);
 for(let i=200;i<world;i+=400){
 ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,world);ctx.stroke();
 ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(world,i);ctx.stroke();
 }
 ctx.setLineDash([]);

 // buildings and parks
 for(let x=30;x<world;x+=400){
 for(let y=30;y<world;y+=400){
 if(x%400<130||y%400<130)continue;
 ctx.fillStyle='#74787d';ctx.fillRect(x,y,210,210);
 ctx.fillStyle='#999';ctx.fillRect(x+8,y+8,194,194);
 ctx.fillStyle='#416477';
 for(let a=x+20;a<x+190;a+=42)
 for(let b=y+20;b<y+190;b+=42)
 ctx.fillRect(a,b,25,25);
 }
 }
}

function carDraw(x,y,color,a=0){
 ctx.save();ctx.translate(x,y);ctx.rotate(a);
 ctx.fillStyle='#111';
 ctx.fillRect(-23,-29,8,15);ctx.fillRect(15,-29,8,15);
 ctx.fillRect(-23,14,8,15);ctx.fillRect(15,14,8,15);
 ctx.fillStyle=color;ctx.fillRect(-20,-36,40,72);
 ctx.fillStyle='#a8e0ff';ctx.fillRect(-14,-24,28,15);
 ctx.fillRect(-14,9,28,15);
 ctx.fillStyle='#fff';ctx.fillRect(-14,-34,8,4);ctx.fillRect(6,-34,8,4);
 ctx.restore();
}

function playerDraw(x,y){
 ctx.fillStyle='#ffca80';
 ctx.beginPath();ctx.arc(x,y-13,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#1976d2';ctx.fillRect(x-10,y-3,20,22);
 ctx.fillStyle='#222';ctx.fillRect(x-10,y+18,7,12);ctx.fillRect(x+3,y+18,7,12);
}

function loop(){
 movement();
 let p=inCar?car:player;

 cam.x=Math.max(0,Math.min(world-W,p.x-W/2));
 cam.y=Math.max(0,Math.min(world-H,p.y-H/2));

 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 drawCity();

 // traffic
 for(let t of traffic){
 t.x+=t.s*t.d;
 if(t.x>world)t.x=0;if(t.x<0)t.x=world;
 carDraw(t.x,t.y,t.col);
 }

 // coins
 for(let m of coins){
 if(!m.got){
 ctx.fillStyle='#ffd700';
 ctx.beginPath();ctx.arc(m.x,m.y,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#7a5000';ctx.font='15px Arial';ctx.fillText('$',m.x-5,m.y+5);
 if(Math.hypot(p.x-m.x,p.y-m.y)<30){
 m.got=true;cash+=50;
 document.getElementById('mission').innerText='💰 +50 collected!';
 }
 }
 }
 if(coins.every(m=>m.got)){
 coins.forEach(m=>{m.x=rnd(100,2300);m.y=rnd(100,2300);m.got=false});
 }

 // enemies
 for(let e of enemies){
 let d=Math.hypot(p.x-e.x,p.y-e.y);
 if(d<400 && d>1){e.x+=(p.x-e.x)/d*.65;e.y+=(p.y-e.y)/d*.65}
 ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(e.x,e.y-10,11,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#111';ctx.fillRect(e.x-9,e.y,18,20);
 if(d<30&&!inCar)player.hp-=.03;
 }

 // police
 if(wanted>0){
 let d=Math.hypot(p.x-police.x,p.y-police.y);
 if(d>1){police.x+=(p.x-police.x)/d*1.5;police.y+=(p.y-police.y)/d*1.5}
 carDraw(police.x,police.y,'#2875ee',police.a);
 if(d<45&&!inCar)player.hp-=.1;
 }

 // player's car
 carDraw(car.x,car.y,'#e53935',car.a);
 if(!inCar)playerDraw(player.x,player.y);

 ctx.restore();

 if(player.hp<=0){
 player.hp=100;player.x=300;player.y=300;
 inCar=false;wanted=0;
 }
 document.getElementById('hp').innerText=Math.floor(player.hp);
 document.getElementById('wanted').innerText=wanted;
 document.getElementById('cash').innerText=cash;
 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
