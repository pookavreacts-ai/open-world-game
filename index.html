
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MINI CITY 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:white;background:#111cdd;background:#111cddaa;padding:12px;border-radius:12px;z-index:5}
#buttons{position:fixed;bottom:20px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;z-index:5}
#stick{width:120px;height:120px;border:3px solid white;border-radius:50%;background:#ffffff33;position:relative}
#knob{width:48px;height:48px;border-radius:50%;background:#ffffffbb;position:absolute;left:34px;top:34px}
#actions{display:flex;gap:8px}
button{border:2px solid white;background:#cc2222;color:white;border-radius:50%;width:78px;height:78px;font-weight:bold;font-size:14px;touch-action:none}
#map{position:fixed;top:10px;right:10px;z-index:5;width:auto;height:auto;border-radius:10px;padding:12px}
</style>
</head>
<body>

<div id="hud">
<b>🏙️ MINI CITY 3D</b><br>
<span id="msg">Loading City...</span><br>
❤️ 100 | 💰 <span id="money">0</span>
</div>

<button id="map">🗺️ MAP</button>

<div id="buttons">
<div id="stick"><div id="knob"></div></div>
<div id="actions">
<button id="jump">⬆️ JUMP</button>
<button id="enter">🚗 CAR</button>
<button id="attack">👊 HIT</button>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,300);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445544,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(40,100,40);
sun.castShadow=true;
scene.add(sun);

const clock=new THREE.Clock();

const mat=c=>new THREE.MeshStandardMaterial({color:c});
const box=(w,h,d,c)=>{
const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
o.castShadow=true;
o.receiveShadow=true;
return o;
};

let player,car,driving=false;
let yaw=0,camYaw=0,camPitch=.2;
let mx=0,my=0,money=0;
let npcs=[],cars=[],worldObjects=[];
let jumping=false,jumpVel=0;
let city=0;

const cityNames=['Palm City','Downtown','Beach City'];

function clearWorld(){
worldObjects.forEach(o=>scene.remove(o));
worldObjects=[];
npcs.forEach(o=>scene.remove(o.group));
npcs=[];
cars.forEach(o=>scene.remove(o));
cars=[];
}

function add(o){
scene.add(o);
worldObjects.push(o);
return o;
}

function ground(){
const g=box(400,.2,400,0x397e43);
g.position.y=-.1;
add(g);
}

function road(x,z,w,d){
const r=box(w,.15,d,0x343434);
r.position.set(x,.02,z);
add(r);
}

function cityBuild(){
ground();

// roads
for(let i=-160;i<=160;i+=40){
road(i,0,12,400);
road(0,i,400,12);
}

// road lines
for(let i=-180;i<180;i+=20){
const line=box(.3,.18,8,0xffffff);
line.position.set(i,.13,0);
add(line);
const line2=box(8,.18,.3,0xffffff);
line2.position.set(0,.13,i);
add(line2);
}

// sidewalks
for(let i=-160;i<=160;i+=40){
road(i+10,0,3,400);
road(0,i+10,400,3);
}

// buildings
for(let x=-180;x<180;x+=40){
for(let z=-180;z<180;z+=40){
if(Math.abs(x)<16||Math.abs(z)<16)continue;

const h=10+Math.random()*30;
const b=box(24,h,24,[0x999999,0x777788,0xb5a58c,0x667788][Math.floor(Math.random()*4)]);
b.position.set(x,h/2,z);
add(b);

// Windows
for(let y=3;y<h-2;y+=4){
for(let xx=-8;xx<=8;xx+=8){
const win=box(2,2,.2,0x80d5ff);
win.position.set(x+xx,y,z+12.1);
add(win);
}
}

// Roof
const roof=box(24,.6,24,0x555555);
roof.position.set(x,h+.3,z);
add(roof);
}
}

// Trees
for(let i=0;i<30;i++){
const x=Math.random()*300-150;
const z=Math.random()*300-150;
if(Math.abs(x)<20||Math.abs(z)<20)continue;

const tree=new THREE.Group();
const trunk=box(1,4,1,0x775533);
trunk.position.y=2;
tree.add(trunk);

const leaves=new THREE.Mesh(
new THREE.SphereGeometry(3,16,12),
mat(0x228833)
);
leaves.position.y=5;
tree.add(leaves);
tree.position.set(x,0,z);
add(tree);
}
}

// 3D human model
function human(color=0x2244cc){
const g=new THREE.Group();

const torso=box(.65,1,.35,color);
torso.position.y=1.4;
g.add(torso);

const head=new THREE.Mesh(
new THREE.SphereGeometry(.28,20,20),
mat(0xffcc99)
);
head.position.y=2.15;
g.add(head);

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.29,16,16),
mat(0x332211)
);
hair.scale.y=.5;
hair.position.y=2.35;
g.add(hair);

// arms
const armL=new THREE.Group(),armR=new THREE.Group();
const arm1=box(.22,.65,.22,0xffcc99);
arm1.position.y=-.32;
armL.add(arm1);

const arm2=box(.22,.65,.22,0xffcc99);
arm2.position.y=-.32;
armR.add(arm2);

armL.position.set(-.45,1.75,0);
armR.position.set(.45,1.75,0);
g.add(armL,armR);

// legs
const legL=new THREE.Group(),legR=new THREE.Group();
const l1=box(.25,.7,.25,0x222222);
l1.position.y=-.35;
legL.add(l1);

const l2=box(.25,.7,.25,0x222222);
l2.position.y=-.35;
legR.add(l2);

legL.position.set(-.2,.9,0);
legR.position.set(.2,.9,0);
g.add(legL,legR);

g.userData={
armL,armR,legL,legR,
anim:0
};

return g;
}

player=human(0x3366dd);
scene.add(player);

// NPCs
function spawnNPC(){
const colors=[0xdd3333,0x22aa55,0xeeeeee,0xffaa22,0x8833aa];
const p=human(colors[Math.floor(Math.random()*colors.length)]);
p.position.set(Math.random()*150-75,0,Math.random()*150-75);
p.userData.dir=Math.random()*6.28;
p.userData.timer=3+Math.random()*5;
scene.add(p);
npcs.push(p);
}

for(let i=0;i<22;i++)spawnNPC();

// 3D car
function makeCar(color){
const g=new THREE.Group();

const body=box(2,1,4,color);
body.position.y=.8;
g.add(body);

const cabin=box(1.5,1,2,0x99ddff);
cabin.position.set(0,1.5,0);
g.add(cabin);

const wheels=[];
for(let x of [-1,1]){
for(let z of [-1.3,1.3]){
const w=new THREE.Mesh(
new THREE.CylinderGeometry(.4,.4,.3,16),
mat(0x111111)
);
w.rotation.z=Math.PI/2;
w.position.set(x,.4,z);
g.add(w);
wheels.push(w);
}
}

g.userData.wheels=wheels;
return g;
}

car=makeCar(0xdd2222);
car.position.set(5,0,5);
scene.add(car);

// Traffic
for(let i=0;i<10;i++){
const c=makeCar([0x2299ff,0xffaa00,0xffffff,0x33cc66][i%4]);
c.position.set(i%2===0?12:-12,0,Math.random()*300-150);
c.userData.speed=5+Math.random()*8;
c.userData.axis=i%2===0?'z':'x';
scene.add(c);
cars.push(c);
}

// Joystick
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let active=false;

stick.addEventListener('pointerdown',e=>{
active=true;
stick.setPointerCapture(e.pointerId);
moveStick(e);
});

stick.addEventListener('pointermove',e=>{
if(active)moveStick(e);
});

stick.addEventListener('pointerup',()=>{
active=false;
mx=my=0;
knob.style.left='34px';
knob.style.top='34px';
});

function moveStick(e){
const r=stick.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
let d=Math.sqrt(x*x+y*y);
if(d>40){x*=40/d;y*=40/d}
knob.style.left=34+x+'px';
knob.style.top=34+y+'px';
mx=x/40;
my=-y/40;
}

// Swipe camera
let dragging=false,lx=0,ly=0;

renderer.domElement.addEventListener('pointerdown',e=>{
dragging=true;
lx=e.clientX;
ly=e.clientY;
});

window.addEventListener('pointerup',()=>dragging=false);

window.addEventListener('pointermove',e=>{
if(!dragging)return;
camYaw-=(e.clientX-lx)*.005;
camPitch=Math.max(-.3,Math.min(.8,camPitch+(e.clientY-ly)*.003));
lx=e.clientX;
ly=e.clientY;
});

// Keyboard
const keys={};
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// Jump
document.getElementById('jump').addEventListener('pointerdown',()=>{
if(!driving&&player.position.y<=.05){
jumpVel=7;
}
});

// Enter/exit car
document.getElementById('enter').addEventListener('pointerdown',()=>{
if(player.position.distanceTo(car.position)<7){
driving=!driving;
document.getElementById('msg').innerText=driving?'DRIVING CAR':'ON FOOT';
}
});

// Attack
document.getElementById('attack').addEventListener('pointerdown',()=>{
for(let i=npcs.length-1;i>=0;i--){
if(player.position.distanceTo(npcs[i].position)<3){
scene.remove(npcs[i]);
npcs.splice(i,1);
money+=10;
document.getElementById('money').innerText=money;
document.getElementById('msg').innerText='HIT +10';
break;
}
}
});

// Change city
document.getElementById('map').addEventListener('pointerdown',()=>{
city=(city+1)%3;
scene.background.set([0x87ceeb,0x778899,0x55bbdd][city]);
groundColor([0x397e43,0x555555,0x66aa55][city]);
document.getElementById('msg').innerText=cityNames[city];
});

function groundColor(c){
worldObjects.forEach(o=>{
if(o.geometry&&o.geometry.type==='BoxGeometry'&&o.position.y===-.1){
o.material.color.set(c);
}
});
}

// Animation
function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);

let x=mx,y=my;
if(keys.w||keys.arrowup)y=1;
if(keys.s||keys.arrowdown)y=-1;
if(keys.a||keys.arrowleft)x=-1;
if(keys.d||keys.arrowright)x=1;

const target=driving?car:player;

if(Math.abs(x)+Math.abs(y)>.05){
const dx=Math.sin(camYaw)*y+Math.cos(camYaw)*x;
const dz=Math.cos(camYaw)*y-Math.sin(camYaw)*x;
const len=Math.sqrt(dx*dx+dz*dz)||1;
target.position.x+=dx/len*dt*(driving?20:7);
target.position.z+=dz/len*dt*(driving?20:7);
target.rotation.y=Math.atan2(dx,dz);
}

// player in car
if(driving)player.position.copy(car.position);

// Jump
if(!driving){
jumpVel-=18*dt;
player.position.y+=jumpVel*dt;
if(player.position.y<0){
player.position.y=0;
jumpVel=0;
}
}

// Walk animation
if(!driving){
const moving=Math.abs(x)+Math.abs(y)>.1;
player.userData.anim+=dt*8*(moving?1:0);

const a=Math.sin(player.userData.anim)*.5;
player.userData.legL.rotation.x=a;
player.userData.legR.rotation.x=-a;
player.userData.armL.rotation.x=-a;
player.userData.armR.rotation.x=a;
}

// NPC walk
npcs.forEach(p=>{
p.userData.timer-=dt;
if(p.userData.timer<0){
p.userData.dir=Math.random()*6.28;
p.userData.timer=3+Math.random()*5;
}
p.position.x+=Math.sin(p.userData.dir)*dt*1.5;
p.position.z+=Math.cos(p.userData.dir)*dt*1.5;
p.rotation.y=p.userData.dir;
p.userData.anim+=dt*4;
p.userData.legL.rotation.x=Math.sin(p.userData.anim)*.3;
p.userData.legR.rotation.x=-Math.sin(p.userData.anim)*.3;
});

// traffic
cars.forEach(c=>{
if(c.userData.axis==='z'){
c.position.z+=c.userData.speed*dt;
if(c.position.z>180)c.position.z=-180;
}else{
c.position.x+=c.userData.speed*dt;
if(c.position.x>180)c.position.x=-180;
}
});

// camera
const d=driving?10:7;
const h=driving?4:3.5;
const desired=new THREE.Vector3(
target.position.x+Math.sin(camYaw)*d,
target.position.y+h+camPitch*d,
target.position.z+Math.cos(camYaw)*d
);
camera.position.lerp(desired,.15);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

renderer.render(scene,camera);
}

cityBuild();
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
