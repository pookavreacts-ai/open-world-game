
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini GTA Open World V4</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#101820dd;color:white;padding:10px;border-radius:12px;z-index:4;font-size:14px}
#controls{position:absolute;bottom:20px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:5}
#stick{width:125px;height:125px;border-radius:50%;background:#ffffff35;border:2px solid white;position:relative}
#knob{position:absolute;width:52px;height:52px;background:#ffffffbb;border:2px solid #222;border-radius:50%;left:35px;top:35px}
.actions{display:flex;flex-wrap:wrap;justify-content:end;gap:8px;max-width:210px}
button{background:#20242cdd;color:white;border:2px solid white;border-radius:50%;width:76px;height:76px;font-size:13px;touch-action:none}
.small{width:58px;height:58px;border-radius:15px;font-size:14px}
#mapbtn{position:absolute;top:100px;right:12px;z-index:5;border-radius:12px;width:auto;height:auto;padding:10px}
</style>
</head>
<body>

<div id="hud">
<b>🏙️ MINI GTA V4</b><br>
<span id="status">Loading...</span><br>
❤️ 100 | 💰 <span id="cash">0</span><br>
👥 City population: <span id="people">0</span>
</div>

<button id="mapbtn">🗺️ CHANGE CITY</button>

<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div class="actions">
<button id="attack">👊<br>ATTACK</button>
<button id="carbtn">🚗<br>CAR</button>
<button id="jump">⬆️<br>JUMP</button>
</div>
</div>

<script type="importmap">
{
"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,350);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(60,100,50);
scene.add(sun);

const clock=new THREE.Clock();
const keys={};
let cash=0, yaw=0, driving=false, jumpY=0,jumpVel=0;
let moveX=0,moveY=0;
let cameraYaw=0,cameraPitch=.22;
let player=new THREE.Group();
scene.add(player);
let playerModel=null,mixer=null,walkAction=null,idleAction=null;
let car=null,traffic=[],people=[],buildings=[];
let mapIndex=0;

const maps=[
{ name:'Vice Beach',ground:0x4b8751,road:0x333333,sky:0x87ceeb,building:0x9b8b80 },
{ name:'Downtown',ground:0x505050,road:0x242424,sky:0x91b7d9,building:0x667788 },
{ name:'Palm City',ground:0x39804b,road:0x363636,sky:0x91d5ee,building:0xd2b48c }
];

function mat(c){return new THREE.MeshStandardMaterial({color:c})}

function makeBox(w,h,d,c){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));
m.castShadow=true;m.receiveShadow=true;
return m;
}

function addWorldBox(w,h,d,c,x,y,z){
const m=makeBox(w,h,d,c);
m.position.set(x,y,z);
scene.add(m);
return m;
}

function createCar(color){
const g=new THREE.Group();
const body=makeBox(2,1,4,color);
body.position.y=.8;
g.add(body);

const cabin=makeBox(1.5,.8,2,0x99d8ff);
cabin.position.y=1.4;
g.add(cabin);

for(let x of [-1,1]){
for(let z of [-1.3,1.3]){
const w=makeBox(.4,.7,.7,0x111111);
w.position.set(x,.45,z);
g.add(w);
}
}
scene.add(g);
return g;
}

// City
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
mat(maps[0].ground)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.1;
scene.add(ground);

function buildCity(){
const m=maps[mapIndex];

// roads
for(let i=-200;i<=200;i+=40){
addWorldBox(12,.1,400,m.road,i,.02,0);
addWorldBox(400,.1,12,m.road,0,.02,i);
}

// Road markings
for(let i=-200;i<200;i+=20){
addWorldBox(.2,.12,8,0xffffff,i,.08,0);
addWorldBox(8,.12,.2,0xffffff,0,.08,i);
}

// buildings
for(let x=-200;x<200;x+=40){
for(let z=-200;z<200;z+=40){
if(Math.abs(x%40)<12||Math.abs(z%40)<12)continue;

const h=10+Math.random()*25;
const b=addWorldBox(24,h,24,m.building,x,h/2,z);
buildings.push(b);

// Windows
for(let y=3;y<h-2;y+=4){
for(let xx=-8;xx<=8;xx+=8){
const win=makeBox(2,2,.1,0x8bd2ff);
win.position.set(x+xx,y,z+12.1);
scene.add(win);
}
}
}
}

// Park areas
for(let x=-100;x<=100;x+=100){
for(let z=-100;z<=100;z+=100){
const tree=new THREE.Group();
const trunk=makeBox(1,4,1,0x795548);
trunk.position.y=2;
tree.add(trunk);
const leaves=new THREE.Mesh(
new THREE.SphereGeometry(3,12,12),
mat(0x228833)
);
leaves.position.y=5;
tree.add(leaves);
tree.position.set(x+15,0,z+15);
scene.add(tree);
}
}
}

buildCity();

// Player model
const loader=new GLTFLoader();
loader.load('The_Miami_Dealer.glb',gltf=>{
playerModel=gltf.scene;

const bb=new THREE.Box3().setFromObject(playerModel);
const size=bb.getSize(new THREE.Vector3());
const height=size.y||1;

playerModel.scale.setScalar(1.8/height);

const scaledBB=new THREE.Box3().setFromObject(playerModel);
playerModel.position.y-=scaledBB.min.y;

playerModel.traverse(o=>{
if(o.isMesh){o.castShadow=true;o.receiveShadow=true}
});

player.add(playerModel);

if(gltf.animations.length){
mixer=new THREE.AnimationMixer(playerModel);
gltf.animations.forEach(a=>{
let act=mixer.clipAction(a);
if(a.name.toLowerCase().includes('walk')||a.name.toLowerCase().includes('run'))walkAction=act;
else idleAction=act;
});
if(idleAction)idleAction.play();
}
document.getElementById('status').innerText='Character ready';
},undefined,()=>{
document.getElementById('status').innerText='Character file error';
});

// Pedestrians
function makeNPC(){
const g=new THREE.Group();

const shirt=makeBox(.7,1.1,.4,[0x2244cc,0xff8833,0x33aa55,0xaa33aa][Math.floor(Math.random()*4)]);
shirt.position.y=1.4;
g.add(shirt);

const head=new THREE.Mesh(new THREE.SphereGeometry(.3,16,16),mat(0xffcc99));
head.position.y=2.2;
g.add(head);

const legs=makeBox(.6,.8,.3,0x222222);
legs.position.y=.4;
g.add(legs);

scene.add(g);
return g;
}

for(let i=0;i<18;i++){
const p=makeNPC();
p.position.set(Math.random()*100-50,0,Math.random()*100-50);
p.userData.dir=Math.random()*Math.PI*2;
p.userData.timer=2+Math.random()*5;
people.push(p);
}

// Traffic
for(let i=0;i<12;i++){
const t=createCar([0xff2222,0x22aaff,0xffcc00,0xffffff,0x222222][i%5]);
t.position.set(i%2===0?12:-12,0,Math.random()*300-150);
t.userData.speed=5+Math.random()*8;
t.userData.axis=i%2===0?'z':'x';
traffic.push(t);
}

// Player car
car=createCar(0xff2222);
car.position.set(5,0,5);

let camDragging=false,lastX=0,lastY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
camDragging=true;lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener('pointerup',()=>camDragging=false);
window.addEventListener('pointermove',e=>{
if(!camDragging)return;
cameraYaw-=(e.clientX-lastX)*.005;
cameraPitch=Math.max(-.15,Math.min(.8,cameraPitch+(e.clientY-lastY)*.003));
lastX=e.clientX;lastY=e.clientY;
});

// Joystick
const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let joystickActive=false;

stick.addEventListener('pointerdown',e=>{
joystickActive=true;stick.setPointerCapture(e.pointerId);
updateStick(e);
});
stick.addEventListener('pointermove',e=>{
if(joystickActive)updateStick(e);
});
stick.addEventListener('pointerup',()=>{
joystickActive=false;moveX=moveY=0;
knob.style.left='35px';knob.style.top='35px';
});
stick.addEventListener('pointercancel',()=>{
joystickActive=false;moveX=moveY=0;
});

function updateStick(e){
const r=stick.getBoundingClientRect();
let x=e.clientX-r.left-r.width/2;
let y=e.clientY-r.top-r.height/2;
const max=40;
let d=Math.sqrt(x*x+y*y);
if(d>max){x*=max/d;y*=max/d}
knob.style.left=(35+x)+'px';
knob.style.top=(35+y)+'px';
moveX=x/max;
moveY=-y/max;
}

// Jump
document.getElementById('jump').addEventListener('pointerdown',()=>{
if(!driving&&jumpY<=0){
jumpVel=7;
}
});

// Enter car
document.getElementById('carbtn').addEventListener('pointerdown',()=>{
if(player.position.distanceTo(car.position)<6){
driving=!driving;
document.getElementById('status').innerText=driving?'Driving':'On foot';
}
});

// Attack
document.getElementById('attack').addEventListener('pointerdown',()=>{
for(let i=people.length-1;i>=0;i--){
if(player.position.distanceTo(people[i].position)<3){
scene.remove(people[i]);
people.splice(i,1);
cash+=10;
document.getElementById('cash').innerText=cash;
document.getElementById('status').innerText='NPC hit +10';
break;
}
}
});

// Map switch
document.getElementById('mapbtn').addEventListener('pointerdown',()=>{
mapIndex=(mapIndex+1)%maps.length;
scene.background=new THREE.Color(maps[mapIndex].sky);
ground.material.color.set(maps[mapIndex].ground);
document.getElementById('status').innerText=maps[mapIndex].name;
});

// Keyboard
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.04);

if(mixer)mixer.update(dt);

let sx=moveX,sy=moveY;
if(keys.w||keys.arrowup)sy=1;
if(keys.s||keys.arrowdown)sy=-1;
if(keys.a||keys.arrowleft)sx=-1;
if(keys.d||keys.arrowright)sx=1;

const target=driving?car:player;

if(Math.abs(sx)+Math.abs(sy)>.05){
const forwardAngle=cameraYaw;
const dx=Math.sin(forwardAngle)*sy+Math.cos(forwardAngle)*sx;
const dz=Math.cos(forwardAngle)*sy-Math.sin(forwardAngle)*sx;
const len=Math.sqrt(dx*dx+dz*dz)||1;

target.position.x+=dx/len*dt*(driving?20:7);
target.position.z+=dz/len*dt*(driving?20:7);

yaw=Math.atan2(dx,dz);
target.rotation.y=yaw;
}

if(driving)player.position.copy(car.position);

// Jump
if(!driving){
jumpVel-=18*dt;
jumpY+=jumpVel*dt;
if(jumpY<0){jumpY=0;jumpVel=0}
player.position.y=jumpY;
}

// Walking animation
if(walkAction){
if(Math.abs(sx)+Math.abs(sy)>.1){
if(idleAction)idleAction.stop();
walkAction.play();
}else walkAction.stop();
}

// NPC movement
people.forEach(p=>{
p.userData.timer-=dt;
if(p.userData.timer<0){
p.userData.dir=Math.random()*Math.PI*2;
p.userData.timer=3+Math.random()*5;
}
p.position.x+=Math.sin(p.userData.dir)*dt*1.5;
p.position.z+=Math.cos(p.userData.dir)*dt*1.5;
p.rotation.y=p.userData.dir;
});

// Traffic
traffic.forEach(t=>{
if(t.userData.axis==='z'){
t.position.z+=t.userData.speed*dt;
if(t.position.z>180)t.position.z=-180;
}else{
t.position.x+=t.userData.speed*dt;
if(t.position.x>180)t.position.x=-180;
}
});

// Camera rotation
const dist=driving?10:7;
const height=driving?4:3.5;

const desired=new THREE.Vector3(
target.position.x+Math.sin(cameraYaw)*dist,
target.position.y+height+cameraPitch*dist,
target.position.z+Math.cos(cameraYaw)*dist
);

camera.position.lerp(desired,.14);
camera.lookAt(target.position.x,target.position.y+1,target.position.z);

document.getElementById('people').innerText=people.length;
document.getElementById('cash').innerText=cash;

renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
