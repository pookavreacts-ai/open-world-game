
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini GTA 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:absolute;top:10px;left:10px;background:#101820dd;color:white;padding:10px;border-radius:12px;z-index:5}
#controls{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;z-index:5}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px}
button{background:#222;color:white;border:2px solid #fff;border-radius:15px;font-size:22px;touch-action:none}
.pad button{width:58px;height:58px}
.action{width:75px;height:75px;border-radius:50%;background:#c62828;font-size:14px}
</style>
</head>
<body>

<div id="hud">
<b>🏙️ MINI GTA 3D</b><br>
<span id="info">Explore the city</span><br>
❤️ <span id="hp">100</span> | 💰 <span id="cash">0</span><br>
👊 Enemies: <span id="enemyCount">8</span>
</div>

<div id="controls">
<div class="pad">
<div></div><button data-k="up">⬆️</button><div></div>
<button data-k="left">⬅️</button><button data-k="down">⬇️</button><button data-k="right">➡️</button>
</div>
<div style="display:flex;gap:8px">
<button class="action" id="attack">🔫<br>ATTACK</button>
<button class="action" id="carbtn">🚗<br>CAR</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,60,300);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x445544,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,100,50);
sun.castShadow=true;
scene.add(sun);

function material(color){
 return new THREE.MeshStandardMaterial({color});
}

function cube(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(600,600),
 material(0x49834b)
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// City roads
for(let i=-250;i<=250;i+=50){
 cube(12,.08,600,0x333333,i,.05,0);
 cube(600,.08,12,0x333333,0,.05,i);
}

// Road markings
for(let i=-250;i<=250;i+=20){
 cube(.25,.12,8,0xffffff,i,.1,0);
 cube(8,.12,.25,0xffffff,0,.1,i);
}

// Buildings
for(let x=-250;x<250;x+=50){
 for(let z=-250;z<250;z+=50){
 if(Math.abs(x%50)<13 || Math.abs(z%50)<13)continue;

 let h=10+Math.random()*25;
 let col=[0x777777,0x8c8c8c,0x64748b,0x9c8b80][Math.floor(Math.random()*4)];

 cube(30,h,30,col,x,h/2,z);

 // Windows
 for(let yy=3;yy<h-2;yy+=4){
 for(let xx=-10;xx<=10;xx+=10){
 cube(2,2,.15,0x82cfff,x+xx,yy,z+15.1);
 cube(2,2,.15,0x82cfff,x+xx,yy,z-15.1);
 }
 }
 }
}

// Character
function makePerson(color){
 const g=new THREE.Group();

 const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.45),material(color));
 torso.position.y=1.5;
 torso.castShadow=true;
 g.add(torso);

 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,16),material(0xffcc99));
 head.position.y=2.35;
 head.castShadow=true;
 g.add(head);

 const arm1=new THREE.Mesh(new THREE.BoxGeometry(.22,.85,.22),material(color));
 arm1.position.set(-.55,1.5,0);
 g.add(arm1);

 const arm2=arm1.clone();
 arm2.position.x=.55;
 g.add(arm2);

 const leg1=new THREE.Mesh(new THREE.BoxGeometry(.25,.8,.25),material(0x222222));
 leg1.position.set(-.2,.4,0);
 g.add(leg1);

 const leg2=leg1.clone();
 leg2.position.x=.2;
 g.add(leg2);

 scene.add(g);
 return g;
}

const player=makePerson(0x1565c0);
player.position.set(0,0,0);

// Car
function makeCar(color){
 const g=new THREE.Group();

 const base=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),material(color));
 base.position.y=.8;
 g.add(base);

 const top=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,2),material(0x80cfff));
 top.position.y=1.5;
 g.add(top);

 for(let x of [-.9,.9]){
 for(let z of [-1.3,1.3]){
 const wheel=new THREE.Mesh(new THREE.BoxGeometry(.4,.7,.7),material(0x111111));
 wheel.position.set(x,.45,z);
 g.add(wheel);
 }
 }

 scene.add(g);
 return g;
}

const car=makeCar(0xff3333);
car.position.set(8,0,0);

// Traffic cars
let traffic=[];
for(let i=0;i<8;i++){
 let t=makeCar([0xffcc00,0x00ccff,0xffffff,0x222222][i%4]);
 t.position.set(Math.random()*100-50,0,Math.random()*100-50);
 traffic.push(t);
}

// Enemies
let enemies=[];
function spawnEnemy(){
 const e=makePerson(0xd62828);
 e.position.set(Math.random()*100-50,0,Math.random()*100-50);
 enemies.push(e);
}
for(let i=0;i<8;i++)spawnEnemy();

// Keys
const keys={};
document.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
});
document.addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

document.querySelectorAll('[data-k]').forEach(b=>{
 let k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{
 e.preventDefault();keys[k]=true;
 });
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 b.addEventListener(ev,()=>keys[k]=false);
 });
});

// Mobile action
let money=0,hp=100,driving=false;

document.getElementById('carbtn').addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(player.position.distanceTo(car.position)<5){
 driving=!driving;
 document.getElementById('info').innerText=driving?'🚗 Driving':'👤 On foot';
 }
});

document.getElementById('attack').addEventListener('pointerdown',e=>{
 e.preventDefault();
 attackEnemy();
});

function attackEnemy(){
 let target=null;
 let best=8;

 for(let e of enemies){
 let d=player.position.distanceTo(e.position);
 if(d<best){best=d;target=e}
 }

 if(target){
 scene.remove(target);
 enemies.splice(enemies.indexOf(target),1);
 money+=20;
 spawnEnemy();
 document.getElementById('info').innerText='Enemy defeated +20';
 }
}

// Camera and movement
let yaw=0;
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 let move=0,turn=0;
 if(keys.up||keys.w)move=1;
 if(keys.down||keys.s)move=-1;
 if(keys.left||keys.a)turn=1;
 if(keys.right||keys.d)turn=-1;

 let target=driving?car:player;

 // Character rotation
 if(!driving){
 yaw+=turn*dt*2.5;
 player.rotation.y=yaw;

 player.position.x+=Math.sin(yaw)*move*dt*10;
 player.position.z+=Math.cos(yaw)*move*dt*10;
 }else{
 car.rotation.y=yaw;
 yaw+=turn*dt*2;
 car.position.x+=Math.sin(yaw)*move*dt*20;
 car.position.z+=Math.cos(yaw)*move*dt*20;
 player.position.copy(car.position);
 player.rotation.y=yaw;
 }

 // Enemies chase
 for(let e of enemies){
 let d=e.position.distanceTo(target.position);
 if(d<40 && d>2){
 let dx=target.position.x-e.position.x;
 let dz=target.position.z-e.position.z;
 e.position.x+=dx/d*dt*3;
 e.position.z+=dz/d*dt*3;
 e.rotation.y=Math.atan2(dx,dz);
 }
 }

 // Traffic
 for(let t of traffic){
 t.position.z+=dt*12;
 if(t.position.z>100)t.position.z=-100;
 }

 // Camera behind player
 const distance=driving?12:8;
 const height=driving?6:4;

 let camPos=new THREE.Vector3(
 target.position.x-Math.sin(yaw)*distance,
 target.position.y+height,
 target.position.z-Math.cos(yaw)*distance
 );

 camera.position.lerp(camPos,.12);
 camera.lookAt(target.position.x,target.position.y+1.5,target.position.z);

 document.getElementById('hp').innerText=hp;
 document.getElementById('cash').innerText=money;
 document.getElementById('enemyCount').innerText=enemies.length;

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
