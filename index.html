
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1,user-scalable=no">
<title>Mini Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#222;font-family:Arial;color:white}
canvas{display:block}
#ui{position:fixed;top:10px;left:10px;z-index:5}
button{background:#222;color:white;border:2px solid white;border-radius:12px;padding:14px;font-size:17px}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:15px;z-index:5}
.pad{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:5px}
.pad button{touch-action:none;padding:0;font-size:24px}
#action{width:100px;height:100px;border-radius:50%;background:#c62828}
</style>
</head>
<body>
<div id="ui">
  <b>🏙️ MINI CITY</b><br>
  <span id="score">Mission: Find the car!</span><br>
  <button onclick="restart()">Restart</button>
</div>
<canvas id="game"></canvas>
<div id="controls">
  <div class="pad">
    <div></div><button data-key="up">⬆️</button><div></div>
    <button data-key="left">⬅️</button><button data-key="down">⬇️</button><button data-key="right">➡️</button>
  </div>
  <button id="action">🚗<br>ENTER</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener("resize",resize);

const keys={};
let player={x:300,y:300};
let car={x:450,y:300};
let driving=false,score=0;
let camera={x:0,y:0};
const world=2400;

function restart(){
 player={x:300,y:300};
 car={x:450,y:300};
 driving=false;score=0;
}
addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===" "){e.preventDefault();toggleCar()}
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});
 b.addEventListener("pointerup",()=>keys[k]=false);
 b.addEventListener("pointerleave",()=>keys[k]=false);
 b.addEventListener("pointercancel",()=>keys[k]=false);
});
document.getElementById("action").addEventListener("click",toggleCar);

function toggleCar(){
 let p=driving?car:player;
 if(Math.hypot(player.x-car.x,player.y-car.y)<100 || driving){
   driving=!driving;
   document.getElementById("score").innerText=driving?"Driving! Explore the city":"On foot!";
 }
}

function move(){
 let p=driving?car:player;
 let speed=driving?5:3;
 if(keys.up||keys.w)p.y-=speed;
 if(keys.down||keys.s)p.y+=speed;
 if(keys.left||keys.a)p.x-=speed;
 if(keys.right||keys.d)p.x+=speed;
 p.x=Math.max(20,Math.min(world-20,p.x));
 p.y=Math.max(20,Math.min(world-20,p.y));
 if(driving){player.x=car.x;player.y=car.y}
}

function drawCity(){
 ctx.fillStyle="#426b43";
 ctx.fillRect(0,0,world,world);

 // roads
 ctx.fillStyle="#444";
 for(let i=200;i<world;i+=400){
   ctx.fillRect(i-60,0,120,world);
   ctx.fillRect(0,i-60,world,120);
 }
 // road markings
 ctx.strokeStyle="#ddd";
 ctx.lineWidth=3;
 ctx.setLineDash([25,25]);
 for(let i=200;i<world;i+=400){
   ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,world);ctx.stroke();
   ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(world,i);ctx.stroke();
 }
 ctx.setLineDash([]);

 // buildings
 for(let x=40;x<world;x+=400){
   for(let y=40;y<world;y+=400){
     if(Math.abs(x%400-200)<50 || Math.abs(y%400-200)<50)continue;
     ctx.fillStyle="#777";
     ctx.fillRect(x,y,150,140);
     ctx.fillStyle="#9b9b9b";
     ctx.fillRect(x+8,y+8,134,124);
     ctx.fillStyle="#4e677a";
     for(let wx=x+20;wx<x+140;wx+=35)
       for(let wy=y+20;wy<y+125;wy+=35)
         ctx.fillRect(wx,wy,20,20);
   }
 }
}

function draw(){
 move();
 camera.x=(driving?car.x:player.x)-canvas.width/2;
 camera.y=(driving?car.y:player.y)-canvas.height/2;
 camera.x=Math.max(0,Math.min(world-canvas.width,camera.x));
 camera.y=Math.max(0,Math.min(world-canvas.height,camera.y));

 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();ctx.translate(-camera.x,-camera.y);
 drawCity();

 // Mission marker
 ctx.fillStyle="gold";
 ctx.beginPath();ctx.arc(800,800,30,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="black";ctx.font="24px Arial";ctx.fillText("!",790,810);

 // Car
 ctx.fillStyle="#e53935";
 ctx.fillRect(car.x-25,car.y-40,50,80);
 ctx.fillStyle="#9dd7ff";
 ctx.fillRect(car.x-17,car.y-25,34,20);
 ctx.fillRect(car.x-17,car.y+10,34,20);

 // player
 if(!driving){
   ctx.fillStyle="#ffcc80";
   ctx.beginPath();ctx.arc(player.x,player.y-12,12,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#1565c0";
   ctx.fillRect(player.x-10,player.y,20,25);
 }
 ctx.restore();

 if(Math.hypot(player.x-800,player.y-800)<60){
 score++;
 document.getElementById("score").innerText="Mission completed! 🎉 Score: "+score;
 }
 requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
