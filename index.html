
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Mini City</title>
<style>
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:white;background:#111b;padding:12px;border-radius:12px;z-index:2}
#pad{position:fixed;bottom:20px;left:15px;display:grid;grid-template-columns:55px 55px 55px;grid-template-rows:55px 55px 55px;gap:5px}
button{background:#222b;color:white;border:2px solid white;border-radius:14px;font-size:22px;touch-action:none}
#pad button{width:55px;height:55px}
#right{position:fixed;bottom:30px;right:15px;display:flex;flex-direction:column;gap:10px}
.action{width:75px;height:75px;border-radius:50%;background:#b71c1c;font-size:14px}
</style>
</head>
<body>
<div id="hud">
<b>🌆 3D MINI CITY</b><br>
<span id="info">Explore the city</span><br>
❤️ <span id="hp">100</span> | 💰 <span id="money">0</span>
</div>
<div id="pad">
<div></div><button data-k="up">⬆️</button><div></div>
<button data-k="left">⬅️</button><button data-k="down">⬇️</button><button data-k="right">➡️</button>
</div>
<div id="right">
<button class="action" id="jump">🦘<br>JUMP</button>
<button class="action" id="fire">🔫<br>FIRE</button>
<button class="action" id="carbtn">🚗<br>CAR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,450);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x447744,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(100,150,100);
scene.add(sun);

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(1000,1000),
 new THREE.MeshStandardMaterial({color:0x47834c})
);
ground.rotation.x=-Math.PI/2;
scene.add(ground);

function box(x,y,z,sx,sy,sz,col){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:col}));
 m.position.set(x,y,z);scene.add(m);return m;
}

// Roads
for(let i=-400;i<=400;i+=100){
 box(i,0.05,0,18,.1,1000,0x333333);
 box(0,.05,i,1000,.1,18,0x333333);
}
// Road lane marks
for(let i=-400;i<=400;i+=20){
 box(i,.12,0,.5,.1,1000,0xffffff);
 box(0,.12,i,1000,.1,.5,0xffffff);
}

// City buildings
for(let x=-400;x<=400;x+=60){
 for(let z=-400;z<=400;z+=60){
 if(Math.abs(x%100)<18 || Math.abs(z%100)<18)continue;
 let h=10+Math.random()*35;
 let b=box(x,h/2,z,35,h,35,
 ['#777777','#8b8b8b','#b0a0a0','#596b80'][Math.floor(Math.random()*4)]);
 b.castShadow=true;
 // windows
 for(let y=4;y<h;y+=5){
 for(let a=-12;a<=12;a+=8){
 let w=box(x+a,y,z+18,.5,2,.2,0x91d2f0);
 }
 }
 }
}

// Player
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.5),new THREE.MeshStandardMaterial({color:0x1565c0}));
body.position.y=1.5;
player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,16),new THREE.MeshStandardMaterial({color:0xffcc88}));
head.position.y=2.5;player.add(head);
scene.add(player);
player.position.set(0,0,20);

// Player cars
function makeCar(color){
 const g=new THREE.Group();
 let base=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),new THREE.MeshStandardMaterial({color}));
 base.position.y=.8;g.add(base);
 let top=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,2),new THREE.MeshStandardMaterial({color:0x9ed8ef}));
 top.position.y=1.5;g.add(top);
 scene.add(g);return g;
}
const car=makeCar(0xff2222);
car.position.set(10,0,20);

// Enemy
function makeEnemy(x,z){
 const g=new THREE.Group();
 let torso=new THREE.Mesh(new THREE.BoxGeometry(1,1.5,.5),new THREE.MeshStandardMaterial({color:0xd32f2f}));
 torso.position.y=1.5;g.add(torso);
 let h=new THREE.Mesh(new THREE.SphereGeometry(.4),new THREE.MeshStandardMaterial({color:0xffcc88}));
 h.position.y=2.5;g.add(h);
 g.position.set(x,0,z);scene.add(g);return g;
}
let enemies=[];
for(let i=0;i<12;i++)enemies.push(makeEnemy(Math.random()*300-150,Math.random()*300-150));

// Traffic
let traffic=[];
for(let i=0;i<10;i++){
 let c=makeCar([0xffcc00,0x00ccff,0xffffff,0x222222][i%4]);
 c.position.set(Math.random()*300-150,0,Math.random()*300-150);
 traffic.push(c);
}

const keys={};
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{
 let k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});

let driving=false,hp=100,money=0,jumping=false,vy=0;
let bullets=[];
const clock=new THREE.Clock();

document.getElementById('carbtn').onclick=()=>{
 if(player.position.distanceTo(car.position)<5){
 driving=!driving;
 document.getElementById('info').innerText=driving?'Driving 🚗':'On foot';
 }
};

document.getElementById('jump').onclick=()=>{
 if(!jumping){vy=8;jumping=true}
};

document.getElementById('fire').onclick=()=>{
 let target=null,dmin=50;
 for(let e of enemies){
 let d=player.position.distanceTo(e.position);
 if(d<dmin){dmin=d;target=e}
 }
 if(target){
 scene.remove(target);
 enemies.splice(enemies.indexOf(target),1);
 money+=10;
 enemies.push(makeEnemy(Math.random()*300-150,Math.random()*300-150));
 document.getElementById('info').innerText='Enemy defeated!';
 }
};

function animate(){
 requestAnimationFrame(animate);
 let dt=Math.min(clock.getDelta(),.05);
 let p=driving?car:player;
 let speed=driving?25:12;

 let forward=0,side=0;
 if(keys.up||keys.w)forward=1;
 if(keys.down||keys.s)forward=-1;
 if(keys.left||keys.a)side=-1;
 if(keys.right||keys.d)side=1;

 p.position.x+=side*speed*dt;
 p.position.z-=forward*speed*dt;
 if(driving){
 player.position.copy(car.position);
 }

 if(jumping&&!driving){
 player.position.y+=vy*dt;
 vy-=20*dt;
 if(player.position.y<=0){player.position.y=0;jumping=false;vy=0}
 }

 // Enemy chase
 let target=driving?car:player;
 for(let e of enemies){
 let d=e.position.distanceTo(target.position);
 if(d<100&&d>2){
 e.position.x+=(target.position.x-e.position.x)*dt*.5;
 e.position.z+=(target.position.z-e.position.z)*dt*.5;
 }
 }

 // Traffic motion
 for(let t of traffic){
 t.position.z+=dt*15;
 if(t.position.z>200)t.position.z=-200;
 }

 // Camera follow
 let camTarget=new THREE.Vector3(target.position.x,8,target.position.z+12);
 camera.position.lerp(camTarget,.08);
 camera.lookAt(target.position.x,1,target.position.z);

 document.getElementById('hp').innerText=Math.floor(hp);
 document.getElementById('money').innerText=money;

 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
